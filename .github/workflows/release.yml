name: Release

# Pushing a tag like v0.1.0 builds the archives with GoReleaser and publishes
# a GitHub release with them and checksums.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Code signing (D100, docs/SIGNING.md): off until these are set in the
    # repository's settings; then Windows and macOS programs are signed.
    env:
      IMUX_SIGN_STORETYPE: ${{ vars.IMUX_SIGN_STORETYPE }}
      IMUX_SIGN_KEYSTORE: ${{ vars.IMUX_SIGN_KEYSTORE }}
      IMUX_SIGN_ALIAS: ${{ vars.IMUX_SIGN_ALIAS }}
      IMUX_SIGN_TSA: ${{ vars.IMUX_SIGN_TSA }}
      IMUX_SIGN_STOREPASS: ${{ secrets.IMUX_SIGN_STOREPASS }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...
      # GoReleaser from the Go module proxy, not a GitHub download: three
      # releases failed on a 504 from that download (0.24.0-0.25.1).
      - name: Install GoReleaser
        run: |
          for i in 1 2 3; do
            GOTOOLCHAIN=auto GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/goreleaser/v2@v2.20.0 && break
            sleep 20
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH" # go install's folder is not on the PATH
          "$RUNNER_TEMP/bin/goreleaser" --version
      - name: The Nerd Font that ships with i-mux (D94)
        run: ./scripts/fetch-font.sh build
      - name: jsign for Windows signing (D100; nothing while signing is off)
        run: ./scripts/sign-windows.sh --fetch
      - name: Cross-build Windows NSIS installers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          ./scripts/build-installer.sh --version "${GITHUB_REF_NAME#v}" --arch all
      - name: GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to hamzayogurtcuoglu/homebrew-tap (T7.4).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Install the published release the way users do, on every platform.
  smoke:
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
