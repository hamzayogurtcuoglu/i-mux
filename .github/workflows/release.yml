name: Release

# Pushing a tag like v0.1.0 builds the archives with GoReleaser and publishes
# a GitHub release with them and checksums.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...
      # GoReleaser from the Go module proxy, not a GitHub download: three
      # releases failed on a 504 from that download (0.24.0-0.25.1).
      - name: Install GoReleaser
        run: |
          for i in 1 2 3; do
            go install github.com/goreleaser/goreleaser/v2@latest && break
            sleep 20
          done
          goreleaser --version
      - name: GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to hamzayogurtcuoglu/homebrew-tap (T7.4).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Install the published release the way users do, on every platform.
  smoke:
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
