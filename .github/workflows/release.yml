name: Release

# Pushing a tag like v0.1.0 builds the archives with GoReleaser and publishes
# a GitHub release with them and checksums.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to hamzayogurtcuoglu/homebrew-tap (T7.4).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Install the published release the way users do, on every platform.
  smoke:
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
