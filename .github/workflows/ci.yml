name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: go vet
        run: go vet ./... && go vet -tags e2e ./...
      - name: Generated files are current
        run: go generate ./... && git diff --exit-code

  lint-windows:
    # The Windows build (D85): lint and vet, the e2e tests included (T90.9).
    runs-on: ubuntu-latest
    env:
      GOOS: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: go vet
        run: go vet ./... && go vet -tags e2e ./...

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fixture privacy guard
        run: ./scripts/check-fixtures.sh
      - name: shellcheck
        run: shellcheck -s sh install.sh scripts/*.sh scripts/screenshots/*.sh e2e/fakeagents/fake.sh e2e/fakeagents/fake-* e2e/fakeagents/nvim

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  # The e2e suite on the engine, i-mux-core (D87), built from go.mod's pin
  # by make build; no tmux is installed.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: End-to-end tests
        run: make e2e

  # Windows (D85, T90.9): the unit tests, and the e2e suite on i-mux-core
  # with the Go fake agents and ConPTY clients; e2e/skips_windows_test.go
  # lists the tests that cannot apply there.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Build imux and imux-core
        run: |
          go build -o bin/imux.exe ./cmd/imux
          go build -o bin/imux-core.exe ./cmd/imux-core
          bin/imux-core.exe -V
      - name: End-to-end tests on i-mux-core
        run: |
          $env:IMUX_E2E_BIN = "$PWD\bin\imux.exe"
          $env:IMUX_TMUX_BIN = "$PWD\bin\imux-core.exe"
          go test -tags e2e -count=1 -timeout 45m ./e2e/...

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Binary size gate (< 15 MB stripped)
        run: make size

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Short fuzzing
        run: make fuzz-short FUZZTIME=60s

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install GoReleaser (from the Go module proxy, like the release)
        run: |
          for i in 1 2 3; do
            GOTOOLCHAIN=auto GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/goreleaser/v2@v2.20.0 && break
            sleep 20
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The Nerd Font that ships with i-mux (D94)
        run: ./scripts/fetch-font.sh build
      # The release's signing path (D100), tested at every push with a
      # throw-away self-signed certificate: the binaries, setup.exe and its
      # uninstaller are signed here and checked in the windows-installer job.
      - name: A throw-away code-signing certificate
        run: |
          d="$RUNNER_TEMP/ci-sign"
          mkdir -p "$d"
          openssl req -x509 -newkey rsa:3072 -sha256 -days 2 -nodes -subj "/CN=i-mux CI test signing" \
            -addext "extendedKeyUsage=codeSigning" -addext "keyUsage=digitalSignature" \
            -keyout "$d/key.pem" -out "$d/cert.pem"
          openssl pkcs12 -export -inkey "$d/key.pem" -in "$d/cert.pem" -name imux-ci -passout pass:ci-only -out "$d/ci.p12"
          {
            echo "IMUX_SIGN_STORETYPE=PKCS12"
            echo "IMUX_SIGN_KEYSTORE=$d/ci.p12"
            echo "IMUX_SIGN_ALIAS=imux-ci"
            echo "IMUX_SIGN_STOREPASS=ci-only"
            echo "IMUX_SIGN_TSA=none"
          } >> "$GITHUB_ENV"
          ./scripts/sign-windows.sh --fetch
      - name: Cross-build Windows NSIS installers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          ./scripts/build-installer.sh --version 0.0.0-ci --arch all
      - name: GoReleaser snapshot
        run: goreleaser release --snapshot --clean
      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: bin/imux_0.0.0-ci_windows_amd64_setup.exe

  windows-installer:
    needs: release-snapshot
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: .
      - name: Install silently, run imux doctor and uninstall cleanly
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path .\imux_0.0.0-ci_windows_amd64_setup.exe).Path
          $instDir = Join-Path $env:LOCALAPPDATA 'Programs\i-mux'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\i-mux.lnk'
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\i-mux'

          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup /S exited with $($p.ExitCode)" }
          foreach ($f in @('imux.exe', 'imux-core.exe', 'LICENSE', 'README.md', 'uninstall.exe', 'fonts\JetBrainsMonoNerdFont-Regular.ttf', 'fonts\OFL.txt')) {
            $fp = Join-Path $instDir $f
            if (-not (Test-Path -LiteralPath $fp -PathType Leaf)) { throw "missing $fp" }
          }
          if (-not (Test-Path -LiteralPath $lnk -PathType Leaf)) { throw "missing $lnk" }
          if (-not (Test-Path -Path $uninstKey)) { throw "missing $uninstKey" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -ieq $instDir.TrimEnd('\') })) {
            throw "$instDir not on user PATH ($userPath)"
          }

          # Signed by the snapshot's throw-away certificate (D100): untrusted,
          # but each file carries it.
          foreach ($f in @($setup, (Join-Path $instDir 'imux.exe'), (Join-Path $instDir 'imux-core.exe'), (Join-Path $instDir 'uninstall.exe'))) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -ne 'CN=i-mux CI test signing') {
              throw "$f is not signed by the CI certificate ($($sig.Status))"
            }
          }

          & (Join-Path $instDir 'imux.exe') doctor --ci
          if ($LASTEXITCODE -ne 0) { throw "imux doctor --ci failed ($LASTEXITCODE)" }

          $up = Start-Process -FilePath (Join-Path $instDir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($up.ExitCode -ne 0) { throw "uninstall /S exited with $($up.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path -LiteralPath $instDir) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $instDir) { throw "$instDir still exists after uninstall" }
          if (Test-Path -LiteralPath $lnk) { throw "$lnk still exists after uninstall" }
          if (Test-Path -Path $uninstKey) { throw "$uninstKey still exists after uninstall" }
          $userPathAfter = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPathAfter -split ';' | Where-Object { $_.TrimEnd('\') -ieq $instDir.TrimEnd('\') }) {
            throw "$instDir still on user PATH after uninstall"
          }
