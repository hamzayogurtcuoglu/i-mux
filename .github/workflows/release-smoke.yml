name: Release smoke test

# After a release is published: install it the way users do and check that
# it runs. `imux doctor --ci` skips the agent checks (no agent CLIs here).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Install with install.sh (installs tmux if missing)
        run: sh install.sh --version "$TAG" --prefix "$HOME/.local/bin" --yes
      - name: imux version
        run: |
          "$HOME/.local/bin/imux" version
          "$HOME/.local/bin/imux" version | grep -q "${TAG#v}"
      - name: imux doctor --ci
        run: '"$HOME/.local/bin/imux" doctor --ci'

  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install
        run: brew install hamzayogurtcuoglu/tap/imux
      - name: imux version and doctor
        run: |
          imux version
          imux doctor --ci
