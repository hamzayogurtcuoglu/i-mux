name: Release smoke test

# After a release is published, install it exactly the way the README tells
# users to, with the one-line installer piped into sh, on macOS (Apple Silicon
# and Intel), Ubuntu (x86_64 and ARM) and several Linux distributions in
# containers (WSL runs the same Linux binaries). `imux doctor --ci` skips the
# agent checks (no agent CLIs here).
#
# The Release workflow calls this after publishing: a release created with
# GITHUB_TOKEN does not trigger `on: release` workflows. It can also be run
# by hand for any tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  # The installer from the released commit, fetched like users fetch it.
  INSTALLER: https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.tag }}/install.sh

jobs:
  one-liner:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
        tmux: [install]
        include:
          # Homebrew has no Intel macOS bottles of tmux, libevent and
          # utf8proc: `brew install tmux` builds them (and upgrades what they
          # need) from source, 25-50 minutes on this runner, every release.
          # Here the job tests i-mux's part: the darwin_amd64 archive, the
          # installer and PATH. Installing tmux is tested on Apple Silicon
          # and the Linux distributions.
          - os: macos-15-intel
            tmux: skip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Like a first-time user: a clean environment whose PATH lacks
      # ~/.local/bin, and each OS's default shell (zsh on macOS, bash on Linux).
      - name: Install with the one-line installer (installs tmux unless skipped)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then user_shell=/bin/zsh; else user_shell=/bin/bash; fi
          echo "USER_SHELL=$user_shell" >> "$GITHUB_ENV"
          yes=--yes
          if [ "${{ matrix.tmux }}" = skip ]; then yes=; fi
          env -i HOME="$HOME" USER="$USER" SHELL="$user_shell" TERM=dumb \
            PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            INSTALLER="$INSTALLER" TAG="$TAG" YES="$yes" \
            sh -c 'curl -fsSL "$INSTALLER" | sh -s -- --version "$TAG" $YES' </dev/null
      - name: A new terminal finds imux on PATH
        run: |
          env -i HOME="$HOME" USER="$USER" TERM=dumb PATH=/usr/bin:/bin \
            "$USER_SHELL" -ic 'command -v imux && imux version' 2>/dev/null | tee out.txt
          grep -q "${TAG#v}" out.txt
      - name: imux doctor --ci
        if: ${{ matrix.tmux == 'install' }}
        run: '"$HOME/.local/bin/imux" doctor --ci'
      - name: Without --version the installer picks the latest release
        # Only a full release (no "-rc1" suffix) is "latest". A newer release
        # can come out while this job runs, so the check is against whatever
        # "latest" is now.
        if: ${{ !contains(inputs.tag, '-') }}
        run: |
          curl -fsSL "$INSTALLER" | sh -s -- --prefix "$RUNNER_TEMP/latest" --no-modify-path
          latest=$(curl -fsSI "https://github.com/${{ github.repository }}/releases/latest" \
            | tr -d '\r' | sed -n 's|^[Ll]ocation: .*/tag/v||p')
          echo "latest release: $latest"
          "$RUNNER_TEMP/latest/imux" version | grep -q "${latest:-${TAG#v}}"
      - name: The installer attached to the release works too
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$TAG/install.sh" \
            | sh -s -- --version "$TAG" --prefix "$RUNNER_TEMP/asset" --no-modify-path
          "$RUNNER_TEMP/asset/imux" version | grep -q "${TAG#v}"

  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable-slim
            prep: apt-get update -q && apt-get install -y -q curl ca-certificates
          - image: ubuntu:22.04
            prep: apt-get update -q && apt-get install -y -q curl ca-certificates
          - image: fedora:latest
            prep: dnf install -y -q curl tar gzip
          - image: alpine:latest
            prep: apk add --no-cache curl
          - image: archlinux:latest
            # -Syu: Arch has no partial upgrades (-Sy pulled openssl 4 against
            # packages built for openssl 3, and pacman refused).
            prep: pacman -Syu --noconfirm curl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    steps:
      - name: curl (the one thing the one-liner assumes)
        shell: sh
        run: ${{ matrix.prep }}
      - name: Install with the one-line installer (installs tmux as root)
        shell: sh
        run: curl -fsSL "$INSTALLER" | SHELL=/bin/sh sh -s -- --version "$TAG" --yes
      - name: imux is on PATH for a new login shell, and works
        shell: sh
        run: |
          sh -lc 'imux version' | tee out.txt
          grep -q "${TAG#v}" out.txt
          sh -lc 'imux doctor --ci'

  homebrew:
    # Runs once the tap exists: create hamzayogurtcuoglu/homebrew-tap, add the
    # HOMEBREW_TAP_GITHUB_TOKEN secret, and set the repository variable
    # HOMEBREW_TAP_ENABLED=true.
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # Intel: Homebrew builds tmux from source
    steps:
      - name: brew install
        run: brew install hamzayogurtcuoglu/tap/imux
      - name: imux version and doctor
        run: |
          imux version
          imux doctor --ci
