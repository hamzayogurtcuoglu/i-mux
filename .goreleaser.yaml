# GoReleaser configuration (TASKS.md M7). Check locally with:
#   goreleaser release --snapshot --clean
version: 2

project_name: imux

builds:
  - id: imux
    main: ./cmd/imux
    binary: imux
    env:
      - CGO_ENABLED=0
    # windows: native, on psmux (install.ps1; docs/WINDOWS.md).
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hamzayogurtcuoglu/i-mux/internal/version.Version={{ .Version }}
      - -X github.com/hamzayogurtcuoglu/i-mux/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/hamzayogurtcuoglu/i-mux/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: imux
    formats: [tar.gz]
    # Windows gets a zip (Expand-Archive in install.ps1): imux_X.Y.Z_windows_amd64.zip
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^e2e:"
      - "^test:"

release:
  github:
    owner: hamzayogurtcuoglu
    name: i-mux
  draft: false
  prerelease: auto
  # The installers are attached to every release too, so this also works:
  #   curl -fsSL https://github.com/hamzayogurtcuoglu/i-mux/releases/latest/download/install.sh | sh
  # `imux update` on Windows runs the release's install.ps1.
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1

# Homebrew formula in hamzayogurtcuoglu/homebrew-tap:
#   brew install hamzayogurtcuoglu/tap/imux
# Published only when the HOMEBREW_TAP_GITHUB_TOKEN secret is set (a token
# that can push to the tap repository); without it the release still ships.
brews:
  - name: imux
    ids: [imux]
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: hamzayogurtcuoglu
      name: homebrew-tap
      token: "{{ envOrDefault \"HOMEBREW_TAP_GITHUB_TOKEN\" \"\" }}"
    directory: Formula
    homepage: https://github.com/hamzayogurtcuoglu/i-mux
    description: Continue an AI coding conversation in another agent CLI, inside tmux
    license: MIT
    dependencies:
      - name: tmux
    install: |
      bin.install "imux"
    test: |
      assert_match "imux", shell_output("#{bin}/imux version")
    commit_author:
      name: hamzayogurtcuoglu
      email: hamzayogurtcuoglu@users.noreply.github.com
