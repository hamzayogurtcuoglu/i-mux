<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="i-mux">
<title>i-mux</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header id="top">
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <h1 id="title">i-mux</h1>
  <span id="status" class="dot off" title="offline"></span>
</header>

<main>
  <section id="pair" hidden>
    <div class="card center">
      <div class="logo">⇄</div>
      <h2 data-t="pair_title">Pair this phone</h2>
      <p data-t="pair_body">On your computer, open i-mux, click <b>Phone</b> on the sidebar and choose <b>Pair a phone</b>. Then scan the QR code with this phone's camera.</p>
      <p id="pair-error" class="error" hidden></p>
    </div>
  </section>

  <section id="list" hidden></section>

  <section id="pane" hidden>
    <div id="screen-wrap"><pre id="screen"></pre></div>
  </section>
</main>

<footer id="controls" hidden>
  <div class="keys">
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="Enter" class="wide">Enter</button>
    <button data-key="Escape">Esc</button>
    <button data-key="Up">↑</button>
    <button data-key="Down">↓</button>
    <button data-key="Tab">Tab</button>
    <button data-key="C-c" class="danger">^C</button>
  </div>
  <form id="say">
    <input id="text" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Message">
    <button type="submit" class="send" data-t="send">Send</button>
  </form>
</footer>
<div id="watching" class="note" hidden data-t="read_only">This phone only watches.</div>
</body>
</html>
