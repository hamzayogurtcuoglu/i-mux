# i-mux configuration (~/.imux/config.toml)
#
# Every key is optional; the values below are the built-in defaults.
# Regex patterns use TOML literal strings ('...'), so backslashes need no escaping.

# Agent order: menu order, agent bar order and auto-switch priority.
order         = ["claude", "antigravity", "copilot", "codex", "opencode"]

# Agent started by a plain `imux`. "" = first installed agent in `order`.
default_agent = ""

# What happens when an agent hits its usage limit:
#   ask  = show a "continue in ..." menu (default)
#   auto = switch to the first installed, non-limited agent in `order`
#   off  = only show the limit in the status bar
on_limit      = "ask"

# What a pane does when its agent exits: "shell" (drop to your login shell) or "close".
on_exit       = "shell"

# Ask GitHub once a day whether a newer i-mux is out (Settings then offers it).
update_check  = true

# UI language: "" = from IMUX_LANG / LANG; "en" or "tr".
locale        = ""

# Editor files open in from the sidebar and search ("micro", "vim", "code" ...).
# "" = micro, then $VISUAL, $EDITOR, nano, vim.
editor        = ""

[handoff]
# Size of the handoff document in characters (runes).
budget_chars        = 30000
# Upper bound for the handoff when passed as a command-line argument.
max_arg_bytes       = 102400
# "argv" passes the handoff as the agent's initial prompt; "paste" pastes it
# into the agent after it started (hides it from `ps`).
inject              = "argv"
# What the new agent does with the handoff: "wait" = confirm in one sentence
# and wait for your next message (starts no work, spends no extra tokens);
# "continue" = carry on with the unfinished request at once.
on_arrival          = "wait"
# "file" = the agent gets a two-line message pointing to the saved handoff
# file and reads it itself (you do not see the whole document); "inline" =
# the whole document is the agent's first message.
deliver             = "file"
# Best-effort removal of API keys, tokens and private keys.
redact_secrets      = true
# Include branch, `git status --short` and `git diff --stat`.
include_git         = true
# Include the path of the previous session's transcript file.
include_source_path = true
# Delete handoff files older than this many days.
keep_days           = 30
# How much of a session file is read: the head (original request) ...
head_bytes          = 1048576
# ... and the tail (recent history, latest task list).
tail_bytes          = 8388608

[limits]
# How often the watcher looks at agent panes while a client is attached.
poll_interval  = "2.5s"
# How often it checks for an attached client when none is attached.
idle_interval  = "15s"
# Limit messages within this time after an agent started are ignored (resumed sessions).
grace          = "20s"
# After a limit prompt, the same pane is not prompted again for this long.
cooldown       = "10m"
# Number of last non-blank lines of an agent's screen that are scanned.
scan_lines     = 25
# How long a limit without a parseable reset time is shown.
default_expiry = "5h"
# Start Claude Code with imux's status line (for this session only, your
# settings files are not changed): it records the 5-hour and weekly
# percentages Claude reports, for the limits panel. Your own status line
# still shows.
claude_statusline = true

[bus]
# Allow agents to message each other with `imux send`.
enabled           = true
# Ask before every message is delivered.
confirm           = false
# A pane counts as idle once its screen did not change for this long.
idle_after        = "5s"
# Largest message `imux send` delivers.
max_message_bytes = 16384
# Messages per minute per sending pane (stops agent ping-pong loops).
rate_per_minute   = 20

[notify]
# A notification when an agent finishes (after working 10 s or more) or asks
# you something, unless you are looking at it: macOS's notification center,
# the Linux desktop's, or your terminal's own when there is no desktop.
enabled           = true
sound             = true
# Run this instead, with the title and the message as arguments (e.g. a push
# to your phone); "" = the system's notifications.
command           = ""

[paste]
# Ctrl+V (or Alt+V) in an agent's pane pastes the image
# on the clipboard (a screenshot) or copied image files: macOS, Linux with
# wl-clipboard or xclip, and WSL (the Windows clipboard). With no image the key
# goes to the pane as before.
images            = true
# Run this instead to get the images: it prints image file paths, one a line.
command           = ""

[explorer]
# Show the files and folders whose names start with a dot (.github, .env,
# .vscode) in the sidebar's explorer; search and Go to File then look into
# hidden folders outside git repositories too. The explorer's ⋯ → Show Hidden
# Files turns it on and off. .git, .svn, .hg, CVS, .DS_Store and Thumbs.db
# stay hidden, and node_modules and the other folders the explorer skips stay
# out of its tree.
show_hidden       = false

[web]
# A click on an HTML file in the explorer asks how to open it: in your browser,
# served by i-mux on localhost, the page reloading itself when its files change
# (Live Preview; nothing to install), or to edit or view it. false: the click
# edits it at once.
enabled           = true
# How Open Preview and `imux web open` show a page: "window": a window of its
# own, without tabs or an address bar (Chrome or Edge; under WSL, Windows' own);
# "tab": a tab of your default browser.
open              = "window"
# A command that opens pages instead, the URL after its words (e.g. "firefox");
# "" = the system's browser.
browser           = ""

[completion]
# Copilot-like suggestions while you edit a file (Tab accepts): files open in
# Neovim with GitHub's copilot.vim, in a profile i-mux keeps (imux-nvim).
# Settings (⚙ on the rail) → Editor → Neovim + Copilot turns it on, sets it up
# and signs you in.
enabled           = false

[tmux]
# Key that opens the pane menu without the prefix. "" disables it.
menu_key_root     = 'C-\'
# Root key that opens Go to File, the editor's Ctrl+P: type letters of a file's
# name, Enter opens it. It takes the key from the program in the pane (a
# shell's or OpenCode's previous command; the up arrow does the same). "" for none.
quick_open_key_root = "C-p"
# prefix + key opens the pane menu.
menu_key_prefix   = "a"
# prefix + key opens the session picker.
picker_key_prefix = "S"
# Sidebar on the left of each window: panes, agents to continue in, split
# buttons, sessions, limits and keys, all clickable (ARCHITECTURE §9.3).
sidebar           = true
# The sidebar's width in columns (20-80); dragging the panel's edge sets it.
sidebar_width     = 43
# prefix + key shows or hides the sidebar.
sidebar_key_prefix = "b"
# prefix + key splits the active pane (asks which agent to start).
split_right_key_prefix = "v"
split_down_key_prefix  = "-"
# prefix + H J K L swaps the active pane with the one on that side (never a
# sidebar, never around the window's edge); the pane keeps the focus.
swap_pane_keys    = true
# prefix + key enters the resize mode: h j k l or the arrows resize the active
# pane (Shift: 10 at a time) until Esc, Enter or any other key. "" for none.
resize_key_prefix = "r"
# prefix + key opens the keys as a searchable list: type to filter, Enter runs
# one (the sidebar's ? and the rail's Help open it too). "" for none.
help_key_prefix   = "?"
# Ctrl+arrows move to the pane there and Ctrl+Alt+arrows split that way, without
# the prefix. Off by default: shells and agents use Ctrl+Left/Right to jump words,
# and macOS uses Ctrl+arrows for its Spaces.
direct_pane_keys  = false
# Icons of the sidebar's rail: "nerd" = the editor's icons (needs a Nerd Font in
# the terminal: imux font install puts one there), "emoji", or "auto" = nerd when
# the terminal's font is a Nerd Font (Terminal.app, iTerm2, VS Code, Windows
# Terminal) or it brings the symbols (Ghostty, WezTerm, kitty), else emoji.
icons             = "auto"
# Tab bar at the top: each tab (tmux window) with its name and state, and a
# + that opens a new tab with the agent you pick.
tabs              = true
# prefix + key opens a new tab (asks which agent); prefix + key names the tab.
new_tab_key_prefix    = "c"
rename_tab_key_prefix = ","
# Clickable agent bar (second status line), the older alternative to the sidebar.
agent_bar         = false
# Mouse support (clicks on the agent bar, pane borders and menus).
mouse             = true
# Scrollback lines kept per pane.
history_limit     = 50000

[theme]
# The colors of the sidebar, popups, menus and tab bar: catppuccin, catppuccin-latte,
# terminal (the terminal's own colors), tokyo-night, tokyo-night-day, dracula, nord,
# gruvbox, gruvbox-light, one-dark, one-light, solarized, solarized-light, kanagawa,
# kanagawa-lotus, rose-pine, rose-pine-dawn, vesper. Settings (⚙) → Theme picks one.
name        = "catppuccin"
# Follow the terminal's light or dark background: light_name on a light one,
# dark_name on a dark one ("" = name's light or dark sibling, e.g. catppuccin-latte).
auto_switch = false
light_name  = ""
dark_name   = ""
# [theme.custom] changes single colors of the theme, [theme.custom.light] and
# [theme.custom.dark] only in that mode: accent, panel_bg, sidebar_bg,
# active_row_bg, selection_bg, surface0, surface1, surface_dim, overlay0,
# overlay1, text, subtext0, mauve, green, yellow, red, blue, teal, peach. A
# color is "#rrggbb", "#rgb", "rgb(r,g,b)", a name such as "blue", or "reset".
#   [theme.custom]
#   accent = "#a6e3a1"

# Per-agent settings. Placeholders in templates:
#   {prompt} = the handoff (at most once), {id} = session id to resume, {uuid} = a new UUID.
# bin = "" resolves the binary on PATH. args are inserted before the template.
# patterns adds limit patterns: [{ re = 'my limit text', severity = "limit" }]
#   (severity: limit | warn | ignore; matching is case-insensitive).
# resume = false disables native resume when switching back to this agent.

[agents.claude]
bin                      = ""
args                     = []
new_args                 = ["--session-id", "{uuid}", "{prompt}"]
resume_args              = ["--resume", "{id}", "{prompt}"]
home                     = ""   # "" = $CLAUDE_CONFIG_DIR or ~/.claude
resume                   = true
patterns                 = []
replace_default_patterns = false
install                  = ""   # "" = i-mux's command (the popup for a missing agent runs it)

# Antigravity CLI (agy): Google's successor to Gemini CLI for personal Google
# accounts. Its conversations are read from brain/<id>/ under home.
[agents.antigravity]
bin                      = ""   # "" = agy on PATH
args                     = []
new_args                 = ["-i", "{prompt}"]
resume_args              = ["--conversation", "{id}", "-i", "{prompt}"]
home                     = ""   # "" = ~/.gemini/antigravity-cli
resume                   = true
patterns                 = []
replace_default_patterns = false
install                  = ""   # "" = i-mux's command (the popup for a missing agent runs it)

[agents.copilot]
bin                      = ""
args                     = []
new_args                 = ["-i", "{prompt}"]
resume_args              = ["--resume", "{id}"]
home                     = ""   # "" = $COPILOT_HOME or ~/.copilot
resume                   = true
patterns                 = []
replace_default_patterns = false
install                  = ""   # "" = i-mux's command (the popup for a missing agent runs it)

[agents.codex]
bin                      = ""
args                     = []
new_args                 = ["{prompt}"]
resume_args              = ["resume", "{id}", "{prompt}"]
home                     = ""   # "" = $CODEX_HOME or ~/.codex
resume                   = true
patterns                 = []
replace_default_patterns = false
install                  = ""   # "" = i-mux's command (the popup for a missing agent runs it)

# OpenCode: works with any model endpoint you configure in OpenCode itself
# (OpenAI-compatible APIs, Anthropic, Ollama, NVIDIA, Groq ...).
[agents.opencode]
bin                      = ""
args                     = []
new_args                 = ["--session", "ses_imux{uuid}", "--prompt", "{prompt}"]
resume_args              = ["--session", "{id}", "--prompt", "{prompt}"]
home                     = ""   # "" = $XDG_DATA_HOME/opencode or ~/.local/share/opencode
resume                   = true
patterns                 = []
replace_default_patterns = false
install                  = ""   # "" = i-mux's command (the popup for a missing agent runs it)
