version: "2"

run:
  timeout: 5m
  build-tags:
    - e2e

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - misspell
    - ineffassign
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    misspell:
      locale: US
      # Agents write British spellings in their data; we must match them.
      ignore-rules:
        - cancelled
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
